[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "blueprint"
version = "0.2.0"
description = "Code intelligence platform for LLM-agentic workflows"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.4.0",
    "networkx>=3.2",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
blueprint = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["playground"]
pythonpath = ["."]
addopts = "-v --tb=short"
