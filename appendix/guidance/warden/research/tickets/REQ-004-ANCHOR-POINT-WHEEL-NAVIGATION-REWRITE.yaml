implementation_directives:
  - id: "D-01"
    directive: "Calculate anchor points dynamically from the loaded algorithm's deck and transitions. Each card in the current forward path gets one anchor."
  - id: "D-02"
    directive: "Distribute anchor angles evenly across the wheel arc (330 deg to 30 deg anticlockwise). First card at arc start, last card at arc end."
  - id: "D-03"
    directive: "Forward gesture (anticlockwise past threshold) snaps knob to next anchor and advances to next card."
  - id: "D-04"
    directive: "Backward gesture (clockwise past threshold) snaps knob to previous anchor and rewinds to previous card."
  - id: "D-05"
    directive: "Decision anchors lock the wheel. Forward drag cycles options. Drag-to-confirm on selected option card advances and recalculates anchors for chosen branch."
  - id: "D-06"
    directive: "Knob always reflects current anchor angle (progress indicator). No free-floating knob position."
  - id: "D-07"
    directive: "Preserve decision records on reverse traversal. Rewinding into a decision card restores previously selected option."
  - id: "D-08"
    directive: "Terminal cards allow backward gesture to rewind to previous card."
  - id: "D-09"
    directive: "Works for all discoverable algorithms without algorithm-specific code or hardcoded card IDs."
  - id: "D-10"
    directive: "Maintain main/dev-mode parity. Dev-mode loads main app via iframe."

acceptance_gates:
  - id: "AG-01"
    gate: "Knob snaps to discrete anchor positions on every navigation event."
  - id: "AG-02"
    gate: "Forward drag from any non-terminal, non-decision card advances to next card and snaps knob."
  - id: "AG-03"
    gate: "Backward drag from any non-cover card rewinds to previous card and snaps knob."
  - id: "AG-04"
    gate: "Decision cards lock wheel. Only drag-to-confirm on selected option advances."
  - id: "AG-05"
    gate: "After decision confirmation, anchors recalculate to include chosen branch."
  - id: "AG-06"
    gate: "Progress indicator shows correct proportional position (11 o'clock start, 1 o'clock end)."
  - id: "AG-07"
    gate: "Reverse traversal across decision nodes does not require re-confirmation."
  - id: "AG-08"
    gate: "Previously selected decision option is preserved when rewinding into a decision card."
  - id: "AG-09"
    gate: "Loop cycles (CPR loop) correctly bounce knob between loop anchor positions."
  - id: "AG-10"
    gate: "All discoverable algorithms navigate correctly with anchor-point system."
  - id: "AG-11"
    gate: "No regression in timer, checklist, carousel, or toolbox behavior."
  - id: "AG-12"
    gate: "Strict dev-mode parity passes after changes."
