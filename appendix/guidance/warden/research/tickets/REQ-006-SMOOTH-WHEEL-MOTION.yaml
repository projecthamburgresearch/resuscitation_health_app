  latest_design_run: "appendix/guidance/warden/design/runs/20260222-123540__bp-20260222-123522-warden__scan-20260222-123533"

implementation_directives:
  - id: "D-01"
    directive: "Add CSS transition on #knob for smooth position changes (ease-out, ~300ms)."
  - id: "D-02"
    directive: "Add a .dragging class that disables CSS transition so knob tracks finger without lag."
  - id: "D-03"
    directive: "During drag in COVER/LINEAR/LOOP/TERMINAL modes, move knob to follow finger position along the arc."
  - id: "D-04"
    directive: "When navigation threshold is crossed, remove .dragging class before calling advance/rewind so CSS transition smoothly animates knob from finger position to new anchor."
  - id: "D-05"
    directive: "On drag release without navigation, remove .dragging class and snap to current anchor with CSS transition (smooth rubber-band return)."
  - id: "D-06"
    directive: "In DECISION mode, knob stays locked at decision anchor (no finger tracking). Decision lock must feel intentional."
  - id: "D-07"
    directive: "No changes to navigation logic, threshold values, or anchor calculation."

acceptance_gates:
  - id: "AG-01"
    gate: "Knob tracks finger position during active drag in non-decision modes."
  - id: "AG-02"
    gate: "Knob smoothly animates to new anchor when navigation threshold is crossed."
  - id: "AG-03"
    gate: "Knob smoothly returns to current anchor when drag ends without navigation."
  - id: "AG-04"
    gate: "Knob stays locked at anchor during decision mode drag (no finger tracking)."
  - id: "AG-05"
    gate: "No regression in navigation behavior (forward, reverse, decision, loop)."
  - id: "AG-06"
    gate: "Motion feels responsive and smooth, not rigid or laggy."
  - id: "AG-07"
    gate: "Dev-mode parity passes."
