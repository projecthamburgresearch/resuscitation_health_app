ticket_id: "REQ-006-SMOOTH-WHEEL-MOTION"
date: "2026-02-22"
status: "RESOLVED" # OPEN | IN_PROGRESS | RESOLVED | BLOCKED
ticket_type: "FEATURE" # FEATURE | BUG | VALIDATION | RESEARCH
title: "Smooth wheel motion: knob follows finger during drag and eases into anchor snap"

objective: |
  The anchor-point system (REQ-004/005) is functionally correct but the knob
  movement feels rigid and mechanical. The lamp-dimmer inspiration requires
  the knob to follow the user's finger during drag (immediate tactile feedback)
  and then ease smoothly into the target anchor position on navigation or release.

  This is purely a motion/feel refinement. No navigation logic changes.

profile:
  target_component: "app/index.html (CSS + drag handlers)"
  route: "home"
  viewport: "390x844"
  theme: "LIGHT_ONLY"
  interaction_mode: "ANCHOR_STATE_MACHINE_V2"

state_machine_scope:
  algorithm_source: "app/algorithms/*.json"
  direction: "both"
  transition_ids:
    - "All — motion applies to every mode"
  state_ids:
    - "All"
  expected_state_contract:
    incoming_zone: "Unchanged"
    current_zone: "Unchanged"
    previous_zone: "Unchanged"
  decision_semantics:
    forward_requires_confirmation: true
    reverse_requires_confirmation: false
  anchor_semantics:
    knob_follows_finger_during_drag: true
    smooth_snap_to_anchor_on_navigation: true
    smooth_snap_back_on_release: true
    decision_knob_locked_at_anchor: true

