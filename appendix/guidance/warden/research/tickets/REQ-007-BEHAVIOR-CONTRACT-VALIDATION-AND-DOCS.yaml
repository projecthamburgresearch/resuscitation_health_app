ticket_id: "REQ-007-BEHAVIOR-CONTRACT-VALIDATION-AND-DOCS"
date: "2026-02-22"
status: "OPEN" # OPEN | IN_PROGRESS | RESOLVED | BLOCKED
ticket_type: "FEATURE" # FEATURE | BUG | VALIDATION | RESEARCH
title: "Behavior-contract validation runner and clinical documentation (REQ-005 D-11 through D-14)"

objective: |
  Deliver the remaining REQ-005 directives that were deferred:
  - D-11: Build a behavior-contract validation runner that exercises forward/reverse/decision
    scenarios across all discoverable algorithms via window.__WARDEN_AUTOMATION and emits a
    machine-readable pass/fail report.
  - D-12: Integrate the behavior-contract runner into the Warden pipeline evidence so failures
    are surfaced before ticket closure.
  - D-13: Ensure dev-mode exposes any additional diagnostic hooks needed for anchor telemetry.
  - D-14: Write a plain-language nurse-facing A-to-Z flow document covering decisions, loops,
    rewinds, and failure modes.

  This ticket is deferred until core wheel behavior (REQ-005/006) is confirmed stable.

profile:
  target_component: "scripts/ (validation runner), app/dev-mode/ (hooks), docs/ (clinical docs)"
  route: "home"
  viewport: "390x844"
  theme: "LIGHT_ONLY"
  interaction_mode: "ANCHOR_STATE_MACHINE_V2"

state_machine_scope:
  algorithm_source: "app/algorithms/*.json"
  direction: "both"
  transition_ids:
    - "All transitions across all algorithms"
  state_ids:
    - "All cards in all algorithms"
  expected_state_contract:
    incoming_zone: "Unchanged from REQ-005"
    current_zone: "Unchanged from REQ-005"
    previous_zone: "Unchanged from REQ-005"

telemetry_levers:
  use_devmode_parity_check: true
  use_scan_json: true
  use_blueprint_outputs: true
  use_static_screenshots_and_splits: true
  use_dynamic_screenshots_and_splits: true
  require_transition_before_after_pairs: true
  require_behavior_contract_report: true

heuristic_levers:
  use_local_rubric_guide: true
  use_local_reference_algorithms: true
  allow_web_search: false

rubric_levers:
  enforce_clear_unambiguous: true
  enforce_self_contained: true
  enforce_falsifiable_binary: true
  enforce_unstacked: true
  enforce_timeless: true

deliverables:
  require_findings_by_severity: true
  require_code_target_map: true
  require_regression_watchlist: true
  require_validation_rerun_summary: true
  require_behavior_matrix_all_algorithms: true

evidence_anchors:
  latest_blueprint_run: "appendix/guidance/warden/blueprint_outputs/runs/20260222-123522-warden"
  latest_scan_run: "appendix/guidance/warden/scans_outputs/runs/20260222-123533"
  latest_design_run: "appendix/guidance/warden/design/runs/20260222-123540__bp-20260222-123522-warden__scan-20260222-123533"

implementation_directives:
  - id: "D-01"
    directive: "Create scripts/behavior_contract_runner.js that uses Playwright to load each algorithm and exercise forward/reverse/decision/loop scenarios via __WARDEN_AUTOMATION."
  - id: "D-02"
    directive: "Runner emits a JSON behavior-contract report per algorithm: scenario name, expected outcome, actual outcome, pass/fail."
  - id: "D-03"
    directive: "Add npm script (e.g. npm run test:behavior) that runs the contract runner and exits non-zero on any failure."
  - id: "D-04"
    directive: "Wire behavior-contract report into Warden design bundle as a required artifact alongside screenshots/splits."
  - id: "D-05"
    directive: "Audit dev-mode overlay for anchor-related diagnostic data; add missing hooks if needed."
  - id: "D-06"
    directive: "Write docs/clinical-flow.md: plain-language A-to-Z guide for nurse-facing usage including decisions, loops, rewinds, and edge cases."
  - id: "D-07"
    directive: "Ticket closure requires run IDs plus pass/fail table by algorithm and scenario."

acceptance_gates:
  - id: "AG-01"
    gate: "Behavior-contract runner executes successfully for all discoverable algorithms."
  - id: "AG-02"
    gate: "Runner report is machine-readable JSON with per-scenario pass/fail."
  - id: "AG-03"
    gate: "npm run test:behavior exits 0 when all pass, non-zero on any fail."
  - id: "AG-04"
    gate: "Behavior report is included in Warden design bundle output."
  - id: "AG-05"
    gate: "Dev-mode exposes anchor/anchorIndex in overlay diagnostics."
  - id: "AG-06"
    gate: "Clinical flow document covers: start, forward, decision-stop, confirm, reverse, loop, terminal."
  - id: "AG-07"
    gate: "Dev-mode parity passes."
