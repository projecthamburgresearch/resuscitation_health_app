ticket_id: "REQ-008-DECISION-CONFIRM-AND-NAV-CONSUMED-FIX"
date: "2026-02-22"
status: "RESOLVED" # OPEN | IN_PROGRESS | RESOLVED | BLOCKED
ticket_type: "BUG" # FEATURE | BUG | VALIDATION | RESEARCH
title: "Fix decision wheel interaction (tap-to-select then drag-to-confirm) and CSS transition jitter after navigation"

objective: |
  Two bugs make the wheel feel broken:
  1. After advancing/rewinding, the knob fights between the smooth anchor snap
     CSS transition and ongoing finger-following in onKnobDrag, causing visible
     jitter. Root cause: setKnobPosition(currentAngle) was called even after
     navConsumed=true, overriding the CSS-animated snap.
  2. Forward wheel drag on decision cards CYCLES between YES/NO options
     (carousel mode) instead of confirming. Users tap an option expecting
     forward drag to advance, but it switches to the other option. This is
     why "the wheel gets stuck at decisions."

  Fix: (1) Stop updating knob after navConsumed. (2) Replace cycling with
  explicit tap-to-select + drag-to-confirm flow.

profile:
  target_component: "app/index.html (JS logic only)"
  route: "home"
  viewport: "390x844"
  theme: "LIGHT_ONLY"
  interaction_mode: "ANCHOR_STATE_MACHINE_V2"

state_machine_scope:
  algorithm_source: "app/algorithms/*.json"
  direction: "both"
  transition_ids:
