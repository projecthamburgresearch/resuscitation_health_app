ticket_id: "REQ-013-ALGORITHM-SOURCE-NORMALIZATION"
date: "2026-03-13"
status: "RESOLVED"
ticket_type: "FEATURE"
title: "Normalize algorithm source boundaries between runtime and prototype surfaces"

objective: |
  Remove ambiguity between the canonical runtime algorithms and the prototype algorithm source surface without destabilizing the clinician state-machine behavior.

profile:
  target_component: "app/algorithms/"
  route: "algorithm-source-boundary"
  viewport: "390x844"
  theme: "LIGHT_ONLY"
  interaction_mode: "DYNAMIC_STATE_MACHINE"

state_machine_scope:
  algorithm_source: "app/algorithms/"
  direction: "both"
  transition_ids: []
  state_ids: []
  expected_state_contract:
    incoming_zone: "Top stack shows upcoming cards"
    current_zone: "Active card is centered inside the wheel"
    previous_zone: "Bottom stack preserves reachable history"

telemetry_levers:
  use_scan_json: true
  use_blueprint_outputs: true
  use_static_screenshots_and_splits: true
  use_dynamic_screenshots_and_splits: true
  require_transition_before_after_pairs: false
  require_behavior_contract_report: true

heuristic_levers:
  use_local_rubric_guide: true
  use_local_reference_algorithms: true
  allow_web_search: false

rubric_levers:
  enforce_clear_unambiguous: true
  enforce_self_contained: true
  enforce_falsifiable_binary: true
  enforce_unstacked: true
  enforce_timeless: true

deliverables:
  require_findings_by_severity: true
  require_code_target_map: true
  require_regression_watchlist: true
  require_validation_rerun_summary: true
  require_behavior_matrix_all_algorithms: false
  require_clinician_trust_score: true

behavior_contract_artifact:
  template_yaml: "appendix/guidance/warden/research/tickets/behavior_contract_matrix_template.yaml"
  template_json: "appendix/guidance/warden/research/tickets/behavior_contract_matrix_template.json"
  output_yaml: "appendix/guidance/warden/research/sessions/20260313_REQ-013_behavior_contract.yaml"
  output_json: "appendix/guidance/warden/research/sessions/20260313_REQ-013_behavior_contract.json"
  score_threshold: 90
  hard_fail_on_critical_gate: true

acceptance_gates:
  - id: "AG-01"
    gate: "A clear canonical-vs-derived rule exists for runtime and prototype algorithm surfaces."
    result: "PASS"
  - id: "AG-02"
    gate: "Prototype files are synchronized or explicitly marked legacy/derived where appropriate."
    result: "PASS"
  - id: "AG-03"
    gate: "No clinician-facing state-machine behavior regresses for touched algorithms."
    result: "PASS"
  - id: "AG-04"
    gate: "Validation evidence and any blockers are recorded explicitly."
    result: "PASS"

acceptance_results:
  - id: "RES-01"
    result: "Established app/algorithms/ as canonical runtime authority in README.md."
  - id: "RES-02"
    result: "Established prototype/json-algorithms/ as a derived/mirrored surface in README.md."
  - id: "RES-03"
    result: "Synchronized drifted prototype algorithms (algo_paed_bls_*) with newer runtime truth."
  - id: "RES-04"
    result: "Preserved the tracked .txt/schema mirrors as legacy reference artifacts and documented that they are non-canonical."

checklist_outcome: "PASS"
checklist_notes: "Algorithm source normalization completed as per Headmaster handoff."
rubric_outcome: "PASS"
research_session: ""
artifacts_updated:
